[package]
name = "comptoir-erp"
version = "1.0.0"
description = "Comptoir ERP — Application de gestion d'importation et vente Madagascar"
authors = ["Comptoir ERP"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
