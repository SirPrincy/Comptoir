<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="favMonogramBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151821" />
      <stop offset="100%" stop-color="#0B0D12" />
    </linearGradient>
    <linearGradient id="favGoldLightGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="favGoldDeepGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="favMeridianGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FBBF24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="favSapphirePoint" x1="50" y1="50" x2="70" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Titane Profond -->
  <rect x="0" y="0" width="100" height="100" rx="25" fill="url(#favMonogramBg)" />
  <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="24.25" stroke="#FBBF24" stroke-width="1.2" stroke-opacity="0.35" fill="none" />

  <!-- Méridien Terrestre et Arc Majeur "C" -->
  <circle cx="50" cy="50" r="37" stroke="url(#favMeridianGrad)" stroke-width="1.2" stroke-dasharray="3 3.5" opacity="0.4" />
  <path d="M 68 22 A 38 38 0 1 0 68 78" stroke="url(#favMeridianGrad)" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.85" />

  <!-- Rayons Intercardinaux -->
  <path d="M 50 50 L 71 29 L 55 46 Z" fill="url(#favSapphirePoint)" />
  <path d="M 50 50 L 71 71 L 55 54 Z" fill="url(#favSapphirePoint)" />
  <path d="M 50 50 L 29 71 L 45 54 Z" fill="url(#favSapphirePoint)" />
  <path d="M 50 50 L 29 29 L 45 46 Z" fill="url(#favSapphirePoint)" />

  <!-- Étoile Boussole des Mondes (Nord, Sud, Est, Ouest) -->
  <path d="M 50 14 L 50 50 L 43 45 Z" fill="url(#favGoldLightGrad)" />
  <path d="M 50 14 L 57 45 L 50 50 Z" fill="url(#favGoldDeepGrad)" />
  <path d="M 50 86 L 43 55 L 50 50 Z" fill="url(#favGoldDeepGrad)" />
  <path d="M 50 86 L 50 50 L 57 55 Z" fill="url(#favGoldLightGrad)" />
  <path d="M 86 50 L 55 43 L 50 50 Z" fill="url(#favGoldLightGrad)" />
  <path d="M 86 50 L 50 50 L 55 57 Z" fill="url(#favGoldDeepGrad)" />
  <path d="M 14 50 L 50 50 L 45 43 Z" fill="url(#favGoldDeepGrad)" />
  <path d="M 14 50 L 45 57 L 50 50 Z" fill="url(#favGoldLightGrad)" />

  <!-- Diamant & Cœur Stellaire -->
  <polygon points="50,44 56,50 50,56 44,50" fill="#FFFFFF" />
  <circle cx="50" cy="50" r="2.2" fill="#D97706" />
  <circle cx="50" cy="50" r="1" fill="#FFFFFF" />
</svg>
