    </linearGradient>
    <linearGradient id="favGoldAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Haute Définition -->
  <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#favBg)" />
  <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="23.25" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.18" fill="none" />

  <!-- Facettes Cube Iso & Monogramme C sculpté -->
  <path d="M 50 15 L 81 32 L 50 48 L 19 32 Z" fill="url(#favTopFacet)" />
  <path d="M 19 34 L 48 50 L 48 83 L 19 67 Z" fill="url(#favLeftFacet)" />
  <path d="M 52 50 L 81 34 L 81 51 L 65 60 L 65 67 L 81 58 L 81 67 L 52 83 Z" fill="url(#favRightFacet)" />
  
  <!-- Point pivot or & lumière -->
  <circle cx="50" cy="48" r="4" fill="url(#favGoldAccent)" />
  <circle cx="50" cy="48" r="1.5" fill="#FFFFFF" />
