<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2028" />
      <stop offset="100%" stop-color="#0F1216" />
    </linearGradient>
    <linearGradient id="favTopFacet" x1="50" y1="14" x2="50" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="favLeftFacet" x1="18" y1="44" x2="50" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#0F2468" />
    </linearGradient>
    <linearGradient id="favRightFacet" x1="82" y1="44" x2="50" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
